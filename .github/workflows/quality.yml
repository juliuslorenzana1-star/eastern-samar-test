name: Platform quality
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_supabase:
        description: Run the isolated full Supabase Docker proof without production credentials
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    if: github.ref != 'refs/heads/codex/full-stack-verification' && (github.event_name != 'workflow_dispatch' || !inputs.full_supabase)
    runs-on: ubuntu-latest
    env:
      VITE_APP_ENVIRONMENT: fixtures
      VITE_SUPABASE_URL: https://qa-fixtures.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_isolated_quality_fixture
      BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm run typecheck:functions
      - run: npm test
      - run: npm run test:database
      - run: npm run test:anonymous
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:moderation:browser
      - run: npm run test:readiness
      - run: npm run test:anonymous:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-verification
          path: test-results.local
  local-supabase-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.full_supabase && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx --no-install playwright-core install --with-deps chromium
      - name: Start dedicated loopback-bound Supabase containers
        run: node scripts/full-stack/local-stack.mjs --start
      - name: Verify actual Auth, Storage, PostgREST and application workflows
        run: node scripts/full-stack/verify.mjs
      - name: Stop only the dedicated test stack, preserving its volumes
        if: always()
        run: node scripts/full-stack/local-stack.mjs --stop
