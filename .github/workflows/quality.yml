name: Platform quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://quality-fixture.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_isolated_quality_fixture
      BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:functions
      - run: npm test
      - run: npm run test:database
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-verification
          path: test-results.local
